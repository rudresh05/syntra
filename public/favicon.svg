<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Base -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#bgGlow)" stroke="url(#neonGlow)" stroke-width="2.5" />

  <!-- Left Code Bracket < -->
  <path d="M38 30L20 50L38 70" stroke="url(#neonGlow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />

  <!-- Right Code Bracket > -->
  <path d="M62 30L80 50L62 70" stroke="url(#neonGlow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />

  <!-- Center Git Stem & Main Node -->
  <line x1="24" y1="50" x2="42" y2="50" stroke="url(#neonGlow)" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="42" cy="50" r="5" fill="#030712" stroke="url(#neonGlow)" stroke-width="4" />

  <!-- Branch Upwards -->
  <path d="M44 47C47 38 52 35 60 35" stroke="url(#neonGlow)" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <circle cx="60" cy="35" r="4" fill="#030712" stroke="url(#neonGlow)" stroke-width="3" />

  <!-- Branch Center -->
  <line x1="47" y1="50" x2="64" y2="50" stroke="url(#neonGlow)" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="64" cy="50" r="4" fill="#030712" stroke="url(#neonGlow)" stroke-width="3" />

  <!-- Branch Downwards -->
  <path d="M44 53C47 62 52 65 60 65" stroke="url(#neonGlow)" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <circle cx="60" cy="65" r="4" fill="#030712" stroke="url(#neonGlow)" stroke-width="3" />
</svg>
