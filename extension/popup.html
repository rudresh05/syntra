<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syntra — LeetCode to GitHub</title>
  <style>
    :root {
      --bg: #18181b;
      --card: #27272a;
      --border: #3f3f46;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --primary: #10b981;
      --primary-hover: #059669;
    }
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 600;
    }
    .badge-connected {
      background-color: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .badge-disconnected {
      background-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--primary);
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      margin-top: 4px;
    }
    button:hover {
      background-color: var(--primary-hover);
    }
    .btn-secondary {
      background-color: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      margin-top: 8px;
    }
    .btn-secondary:hover {
      background-color: var(--border);
    }
    .status-msg {
      font-size: 12px;
      margin-top: 8px;
      text-align: center;
    }
    .recent-list {
      margin-top: 16px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }
    .recent-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      padding: 6px 0;
    }
    .recent-item a {
      color: #60a5fa;
      text-decoration: none;
    }
    .recent-item a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"></path><path d="m8 6-6 6 6 6"></path></svg>
      <span>SYNTRA</span>
    </div>
    <span id="statusBadge" class="badge badge-disconnected">Not Configured</span>
  </div>

  <form id="configForm">
    <div class="form-group">
      <label for="preferredLanguage">Default Coding Language</label>
      <select id="preferredLanguage">
        <option value="java" selected>Java (Default)</option>
        <option value="cpp">C++</option>
        <option value="python3">Python 3</option>
        <option value="javascript">JavaScript</option>
        <option value="typescript">TypeScript</option>
        <option value="golang">Go</option>
        <option value="rust">Rust</option>
      </select>
    </div>

    <div class="form-group">
      <label for="githubToken">GitHub Personal Access Token (PAT)</label>
      <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx" required />
    </div>

    <div class="form-group">
      <label for="githubOwner">GitHub Username / Owner</label>
      <input type="text" id="githubOwner" placeholder="e.g. rudra" required />
    </div>

    <div class="form-group">
      <label for="githubRepo">GitHub Repository Name</label>
      <input type="text" id="githubRepo" placeholder="e.g. leetcode-dsa-solutions" required />
    </div>

    <div class="form-group">
      <label for="githubBranch">Branch</label>
      <input type="text" id="githubBranch" value="main" />
    </div>

    <button type="submit" id="saveBtn">Save & Test Connection</button>
  </form>

  <button class="btn-secondary" id="openTrackerBtn" style="display:flex;align-items:center;justify-content:center;gap:8px;">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
    <span>Open DSA Tracker Dashboard</span>
  </button>

  <div id="statusMsg" class="status-msg"></div>

  <div class="recent-list">
    <label>Recent Solved & Synced</label>
    <div id="recentProblems">
      <div style="font-size: 11px; color: var(--muted);">No submissions synced yet. Solve a LeetCode problem!</div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
